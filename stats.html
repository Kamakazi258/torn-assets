<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torn Stats</title>
<script src="config.js"></script>
<script src="nav.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%230c0d17'/><path d='M15.7 3.2A9 9 0 1 0 21 14.3 7 7 0 0 1 15.7 3.2Z' fill='%23A9C4EF'/></svg>">
<style>
  :root{
    --bg:#0e0f14; --bg2:#0b0c11; --surface:#171a24; --surface2:#1d2130;
    --border:rgba(184,180,214,.12); --border2:rgba(184,180,214,.22);
    --text:#e9e7f2; --muted:#9a96b0; --faint:#6b6880;
    --accent:#b3a8e0; --accent2:#8ea3d8;
    --good:#87c9a6; --warn:#e2c78c; --bad:#d99a9a;
    --glow:0 0 24px rgba(179,168,224,.18); --radius:16px;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 600px at 78% -12%, rgba(142,163,216,.10), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(179,168,224,.09), transparent 60%),
      var(--bg);
    color:var(--text);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    letter-spacing:.1px; min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .moon{width:32px;height:32px;flex:0 0 auto;filter:drop-shadow(0 0 12px rgba(169,196,239,.55))}
  h1{font-size:20px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .idcard{text-align:right;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:8px 14px;min-width:150px}
  .idcard .nm{font-weight:600}.idcard .mt{color:var(--muted);font-size:12px}
  button.refresh{background:linear-gradient(180deg,#232838,#1a1e2b);color:var(--text);
    border:1px solid var(--border2);border-radius:11px;padding:9px 15px;cursor:pointer;
    font-size:13.5px;transition:.15s}
  button.refresh:hover{border-color:var(--accent);box-shadow:var(--glow)}
  button.refresh:disabled{opacity:.5;cursor:default;box-shadow:none}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 22px;border-bottom:1px solid var(--border)}
  .tab{background:transparent;border:none;color:var(--muted);padding:10px 16px 12px;cursor:pointer;
    font-size:14px;position:relative;border-radius:10px 10px 0 0;transition:.15s}
  .tab:hover{color:var(--text)} .tab.active{color:var(--text)}
  .tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  /* masonry: cards keep natural height and pack with no stretched gaps */
  .mrow{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
  .mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .mcol>.card{margin:0}
  .pstrip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .pico{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
  .pico:hover{border-color:var(--accent)}
  .pico.on{background:rgba(142,163,216,.16);color:var(--accent);border-color:var(--accent)}
  .plab{font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:capitalize}
  .pl{font-size:12.5px;color:var(--text);padding:4px 0;border-bottom:1px solid var(--border)}
  .pl:last-child{border-bottom:none}
  @media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
  /* meter row: label+value on one line, bar full width below — never clips */
  .meter{padding:9px 0;border-bottom:1px solid var(--border)}
  .meter:last-child{border-bottom:none}
  .meter .mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .meter .mnm{color:var(--text);display:inline-flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meter .mvl{color:var(--text);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .meter .mvl small{color:var(--muted);font-weight:500;margin-left:5px}
  .meter.maxed .mvl{color:var(--warn)}
  /* inline meter: name | bar | number on one line */
  .meterin{display:flex;align-items:center;gap:11px;padding:6px 0;border-bottom:1px solid var(--border)}
  .meterin:last-child{border-bottom:none}
  .meterin .mi-nm{flex:0 0 132px;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:var(--text);font-size:13px}
  .meterin .bar{flex:1;margin:0}
  .meterin .mi-vl{flex:0 0 auto;min-width:90px;text-align:right;font-weight:600;
    font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px;display:inline-flex;
    align-items:center;justify-content:flex-end;gap:5px}
  .meterin .mi-vl small{color:var(--muted);font-weight:500}
  .maxtag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;
    color:#161616;background:linear-gradient(180deg,#f0d98a,#d9b775);border-radius:5px;
    padding:1px 5px;margin-left:7px;vertical-align:1px}
  .meritgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
  .meritcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px}
  .meritcard.maxed{border-color:rgba(217,183,117,.5)}
  .mc-top{display:flex;align-items:center;gap:6px}
  .mc-top svg{color:var(--muted);flex:0 0 auto}
  .mc-name{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-lvl{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .mc-fx{display:flex;justify-content:space-between;font-size:12px;margin-top:3px}
  .mc-fx span{color:var(--muted)}
  .simrow{display:grid;grid-template-columns:1.3fr auto 1.4fr;gap:10px;align-items:center;
    padding:9px 4px;border-bottom:1px solid var(--border)}
  .simrow:last-child{border-bottom:none}
  .sr-name{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text);min-width:0}
  .sr-name svg{color:var(--muted);flex:0 0 auto}
  .sr-ctl{display:flex;align-items:center;gap:6px}
  .sr-ctl button{width:26px;height:26px;padding:0;border:1px solid var(--border2);background:var(--surface);
    color:var(--text);border-radius:7px;cursor:pointer;font-size:15px;line-height:1}
  .sr-ctl button:hover{border-color:var(--accent)}
  .sr-val{min-width:36px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
  .sr-eff{font-size:12px;text-align:right}
  .card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);
    border-radius:var(--radius);padding:13px 15px 11px;position:relative;overflow:hidden}
  .card h3{margin:0 0 10px;padding-bottom:8px;font-size:14px;color:var(--accent);font-weight:700;
    text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    border-bottom:1px solid var(--border2)}
  .card h3 svg{color:var(--accent)}
  .big{font-size:28px;font-weight:700;letter-spacing:.3px}.big.accent{color:var(--accent)}
  .cardnote{color:var(--faint);font-size:12px;margin-top:3px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .lbl{flex:0 0 168px;color:var(--text)}
  .row .val{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600}
  .bar{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
  .bar>i{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px rgba(179,168,224,.4)}
  .bar.good>i{background:linear-gradient(90deg,#6fae8c,var(--good))}
  .bar.maxed>i{background:linear-gradient(90deg,#d9b775,var(--warn))}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--border2);color:var(--muted)}
  .pill.good{color:var(--good);border-color:rgba(135,201,166,.4)}
  .pill.warn{color:var(--warn);border-color:rgba(226,199,140,.4)}
  .pill.accent{color:var(--accent);border-color:rgba(179,168,224,.45)}
  .mini{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 12px}
  .mini div{font-size:12.5px;color:var(--muted)}
  .mini b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .banner{background:rgba(217,154,154,.09);border:1px solid rgba(217,154,154,.35);
    color:#f0c9c9;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
  .infobox{background:rgba(142,163,216,.08);border:1px solid rgba(142,163,216,.3);
    border-radius:12px;padding:12px 14px;font-size:13px;color:#cdd6ee;margin-top:16px}
  .hidden{display:none}
  .foot{color:var(--faint);font-size:12px;margin-top:26px;text-align:center}
  /* awards controls */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;transition:.12s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:linear-gradient(180deg,#262c3e,#1c2130);color:var(--text)}
  .search{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:9px 13px;font-size:13.5px;outline:none}
  .search:focus{border-color:var(--accent)}
  .count{color:var(--muted);font-size:12.5px;margin-left:auto}
  .awrow{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
  .awrow:last-child{border-bottom:none}
  .awmark{flex:0 0 22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;margin-top:1px}
  .awmark.done{background:rgba(135,201,166,.16);color:var(--good);border:1px solid rgba(135,201,166,.4)}
  .awmark.lock{background:rgba(184,180,214,.06);color:var(--faint);border:1px solid var(--border)}
  .awbody{flex:1;min-width:0}
  .awname{font-weight:600;font-size:14px}
  .awdesc{color:var(--muted);font-size:12.5px;margin-top:1px}
  .awtag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--border2);
    color:var(--muted);margin-left:8px;vertical-align:middle;text-transform:uppercase;letter-spacing:.4px}
  .awprog{margin-top:6px;display:flex;align-items:center;gap:10px}
  .awprog .bar{max-width:280px}
  .awprog .pv{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .awlist{max-height:640px;overflow:auto;margin-top:6px}
  .edu-cat{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;
    padding-bottom:5px;border-bottom:1px solid var(--border2)}
  .edu-cat span:first-child{color:var(--accent);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  .edu-cc{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .perklist{max-height:280px;overflow:auto;margin-top:8px}
  .perkline{font-size:12.5px;color:var(--text);padding:3px 0;border-bottom:1px solid var(--border)}
  .perkline:last-child{border-bottom:none}
  .edu-code{display:inline-block;font-size:10.5px;color:var(--accent2);background:rgba(142,163,216,.1);
    border:1px solid var(--border);border-radius:5px;padding:0 5px;margin-right:6px;font-variant-numeric:tabular-nums}
  .awmark.prog{background:rgba(226,199,140,.14);color:var(--warn);border:1px solid rgba(226,199,140,.4)}
  .awmark.avail{background:rgba(142,163,216,.14);color:var(--accent);border:1px solid rgba(142,163,216,.4)}
  .tab svg{vertical-align:-3px;margin-right:5px}
  /* education states: green done, amber current, lavender available, grey locked */
  .awrow.edu-done{background:rgba(135,201,166,.06)}
  .awrow.edu-current{background:rgba(226,199,140,.06)}
  .awrow.edu-locked{opacity:.55}
  .awrow.sel{outline:1px solid var(--accent);border-radius:8px}
  .awrow{cursor:default}
  .edugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}
  .chiprow{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .statchip{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:1px 7px;border-radius:6px}
  .statchip.int{background:rgba(142,163,216,.16);color:#9fb1e0}
  .statchip.end{background:rgba(226,199,140,.16);color:#e2c78c}
  .statchip.man{background:rgba(135,201,166,.16);color:#7ec9a6}
  .card h3 .seg{margin-left:auto}
  .edutile{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px;cursor:pointer}
  .edutile:hover{border-color:var(--accent)}
  .edutile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .edutile.complete{border-color:rgba(217,183,117,.5)}
  .et-name{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:7px}
  .et-cc{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
  .dt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
  .dt-name{font-size:16px;font-weight:600;color:var(--text);margin-top:3px}
  .dt-sec{margin-bottom:12px}
  .dt-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .dt-val{font-size:13.5px;color:var(--text);line-height:1.5}
  /* two-pane awards (Option C) */
  .awtwo{display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,2fr);gap:12px;align-items:start}
  @media(max-width:720px){.awtwo{grid-template-columns:1fr}}
  /* awards overview band */
  .awband{display:flex;gap:28px;align-items:center;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);
    border-radius:14px;padding:15px 18px;margin-bottom:12px}
  .ab-num .ab-big{font-size:29px;font-weight:800;color:var(--accent);line-height:1}
  .ab-num .ab-mid{font-size:21px;font-weight:700;color:var(--text);line-height:1}
  .ab-sub{font-size:16px;color:var(--muted);font-weight:600}
  .ab-sub2{font-size:12px;color:var(--muted);font-weight:400}
  .ab-lbl{font-size:12px;color:var(--muted);margin-top:4px}
  .ab-div{border-left:1px solid var(--border);padding-left:28px}
  .ab-faint{color:var(--faint)}
  .ab-gold{color:var(--warn)}
  .awshare{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;font-size:13px}
  .awshare svg{color:currentColor}
  .awchase{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:6px}
  .chcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
  .ch-h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .ch-h svg{color:var(--accent)}
  .ch-body{font-size:12.5px;line-height:2;color:var(--text)}
  /* two-pane header ring */
  .awpane-head{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border2);
    padding-bottom:11px;margin-bottom:11px;flex-wrap:wrap}
  .aph-rar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:320px}
  .rbadge{font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:2px 8px;white-space:nowrap}
  .rbadge b{color:var(--text);font-variant-numeric:tabular-nums}
  .rbadge.full{border-color:var(--border-warning,rgba(226,199,140,.5))}
  .rbadge.full b{color:var(--warn)}
  .aph-name{font-size:15px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
  .aph-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .awcat{display:flex;align-items:center;gap:9px}
  .awcat .awcat-n{flex:1}
  /* share card overlay */
  .shareov{position:fixed;inset:0;background:rgba(8,9,14,.72);display:flex;align-items:center;
    justify-content:center;z-index:50;backdrop-filter:blur(3px)}
  .sharecard{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border2);
    border-radius:16px;padding:22px 26px;min-width:300px;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .sc-head{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
  .sc-big{font-size:38px;font-weight:800;color:var(--text);line-height:1}
  .sc-big span{font-size:20px;color:var(--muted);font-weight:600}
  .sc-sub{font-size:12.5px;color:var(--muted);margin:3px 0 14px}
  .sc-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
  .sc-row b{font-variant-numeric:tabular-nums}
  .sc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
  .sc-foot{font-size:11px;color:var(--faint);text-align:center;margin-top:14px}
  .awcats{padding:6px}
  .awcat{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 10px;border-radius:8px;cursor:pointer}
  .awcat:hover{background:var(--surface)}
  .awcat.on{background:rgba(142,163,216,.14)}
  .awcat-n{font-size:13px;color:var(--text)}
  .awcat.on .awcat-n{color:var(--accent)}
  .awcat-c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .awpane .awlist{max-height:600px;overflow:auto}
  /* overview snapshot */
  .snap{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--border)}
  .snap:last-child{border-bottom:none}
  .snap .k{color:var(--muted)}
  .snap .v{font-weight:600;font-variant-numeric:tabular-nums}
  .snap .v small{color:var(--accent2);font-weight:500;margin-left:6px}
  .snap .v em{color:var(--faint);font-style:normal;font-size:11.5px;margin-left:6px}
  .goaleditor{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .goaltitle{color:var(--muted);font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .goalitem{display:flex;flex-direction:column;gap:3px}
  .goalitem span{color:var(--faint);font-size:11px}
  .goalitem input{background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:6px 9px;font-size:12.5px;outline:none;font-variant-numeric:tabular-nums;width:100%}
  .goalitem input:focus{border-color:var(--accent)}
  /* growth */
  .daterow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
  .daterow label{color:var(--muted);font-size:12.5px}
  .daterow input[type=date]{background:var(--surface);border:1px solid var(--border);border-radius:9px;

// ---- helpers --------------------------------------------------------------

const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };

function icon(name,size){

// ---- battle-stat goals (per stat, saved in this browser) ------------------
function getGoal(stat){
  const v=parseInt(localStorage.getItem("torn_goal_"+stat)||"",10);
  return (v && v>0) ? v : GOAL_PER_STAT;
}
function setGoal(stat, v){
  if(v && v>0) localStorage.setItem("torn_goal_"+stat, String(Math.round(v)));
  else localStorage.removeItem("torn_goal_"+stat);
}

// ---- meter row: label + value on one line, bar underneath (won't clip) ----
function meterRow(labelHtml, valueHtml, pct, cls){
  // condensed one-line layout everywhere (name | bar | number)
  return meterRowInline(labelHtml, valueHtml, pct, cls);
}
// inline variant: name on the left, bar in the middle, number on the right — one line
function meterRowInline(labelHtml, valueHtml, pct, cls){
  const m=el("div","meterin");
  m.innerHTML='<span class="mi-nm">'+labelHtml+'</span>';
  const bar=el("div","bar"+(cls?(" "+cls):"")); const i=el("i");
  i.style.width=clamp(pct||0,0,100)+"%"; bar.appendChild(i); m.appendChild(bar);
  const v=el("span","mi-vl"); v.innerHTML=valueHtml; m.appendChild(v);
  return m;
}

// ---- editable skill caps for the % bars (crime skills are always /100) -----
// null = unknown scale (shows the level with no bar). Adjust freely.
const SKILL_MAX = { hunting:50, reviving:100, medical:100, racing:null };
function skillMax(name){
  const k=String(name).toLowerCase();
  if(CRIME_SKILLS.includes(k)) return 100;
  if(k in SKILL_MAX) return SKILL_MAX[k];
  return null;
}

let DATA = null;

$("#tabs").addEventListener("click", e=>{

function statRow(label,val,pct,cls){
  const r=el("div","row"); r.appendChild(el("div","lbl",label));
  const bar=el("div","bar"+(cls?(" "+cls):"")); const i=el("i");

  r.appendChild(el("div","val",val)); return r;
}

// ---- crime unique totals across the account -------------------------------
function crimeName(id){
  const d=(DATA.crime_defs||{})[String(id)];
  return (d&&d.name) || ("Crime #"+id);
}
function crimeSkillLevels(){
  // Reliable crime skill levels straight from the v2 crimes data.
  const crimes=DATA.crimes||{}; const out=[];
  Object.keys(crimes).map(Number).sort((a,b)=>a-b).forEach(id=>{
    const c=crimes[id]||{}; if(c.skill==null) return;
    out.push({id, name:crimeName(id), skill:+c.skill,
              attempts:(c.attempts&&c.attempts.total)||0,
              success:(c.attempts&&c.attempts.success)||0});
  });
  return out;
}

// ---- Overview (full profile snapshot) -------------------------------------
function growthRate(metric){
  // returns {perDay, span} from history for a metric, or null
  const h=(DATA.history||[]).filter(x=>x[metric]!=null);
  if(h.length<2) return null;
  const a=h[0], b=h[h.length-1];
  const days=Math.max(1,(b.ts-a.ts)/86400);
  const per=(b[metric]-a[metric])/days;
  return {perDay:per, span:days};
}
function daysToGoal(current, goal, metric){
  const r=growthRate(metric); if(!r||r.perDay<=0||current>=goal) return null;
  return Math.ceil((goal-current)/r.perDay);
}
function snapRow(k, vHtml){
  const r=el("div","snap");
  r.appendChild(el("div","k",k)); const v=el("div","v"); v.innerHTML=vHtml; r.appendChild(v);
  return r;
}
function statMod(bs, st){
  // returns {mod, info[]} for a battle stat, tolerant of key spellings
  let mod=bs[st+"_modifier"]; if(mod==null) mod=bs[st+"modifier"];
  let info=bs[st+"_info"]; if(info==null) info=bs[st+"info"];
  return {mod: (mod==null?null:+mod), info: Array.isArray(info)?info:[]};
}
// Networth breakdown card — meaningful slices + share bars.
let PERK_SEL=null;
const NW_SLICES=[
  ["items","Items"],["stockmarket","Stocks"],["cayman","Cayman"],["bank","City bank"],
  ["vault","Vault"],["wallet","On hand"],["points","Points value"],["bazaar","Bazaar"],
  ["displaycase","Display case"],["itemmarket","Item market"],["company","Company"],
  ["bookie","Bookie"],["piggybank","Piggy bank"],["trade","Trade"],["auctionhouse","Auction"],
  ["pending","Pending"],["enlisted","Enlisted"],
];
function networthCard(){
  const nw=DATA.networth||{}; if(!Object.keys(nw).length) return null;
  const total=+nw.total|| NW_SLICES.reduce((a,[k])=>a+(+nw[k]||0),0);
  const parts=NW_SLICES.map(([k,label])=>[label,+nw[k]||0]).filter(x=>x[1]>0)
    .sort((a,b)=>b[1]-a[1]);
  if(!parts.length) return null;
  const card=el("div","card");
  const h=cardH("Net Worth","wallet");
  h.appendChild(el("span","pill accent","$"+fmt(total))); card.appendChild(h);
  parts.forEach(([label,v])=>{
    card.appendChild(meterRow(label, "$"+fmt(v)+" <small>"+pct1(total?v/total*100:0)+"%</small>",
      total?v/total*100:0));
  });
  return card;
}
function factionCard(){
  const f=DATA.faction||{}; const name=f.faction_name||f.name;
  if(!name && f.respect==null) return null;
  const c=el("div","card"); c.appendChild(cardH("Faction","faction"));
  if(name) c.appendChild(snapRow("Faction", escapeHtml(String(name))));
  if(f.days_in_faction!=null) c.appendChild(snapRow("Days in faction", fmt(f.days_in_faction)));
  if(f.position!=null) c.appendChild(snapRow("Position", escapeHtml(String(f.position))));
  if(f.respect!=null) c.appendChild(snapRow("Respect", fmt(f.respect)));
  if(f.members!=null) c.appendChild(snapRow("Members", fmt(f.members)));
  else c.appendChild(el("div","cardnote","Respect/members need faction key access."));
  return c;
}
function jobCard(){
  const j=DATA.job||{}; const jp=DATA.jobpoints||{};
  const company=j.company_name||j.name;
  if(!company && j.position==null && !j.job) return null;
  const c=el("div","card"); c.appendChild(cardH("Job","job"));
  if(j.job||j.company_type) c.appendChild(snapRow("Job", escapeHtml(String(j.job||"Employee"))));
  if(company) c.appendChild(snapRow("Company", escapeHtml(String(company))));
  if(j.days_in_company!=null) c.appendChild(snapRow("Days in company", fmt(j.days_in_company)));
  if(j.company_type!=null) c.appendChild(snapRow("Type", escapeHtml(String(j.company_type))));
  if(j.position!=null) c.appendChild(snapRow("Position", escapeHtml(String(j.position))));
  if(j.income!=null) c.appendChild(snapRow("Income", "$"+fmt(j.income)));
  // job points: prefer the current company's points from jobpoints, else profile field
  let pts=j.jobpoints;
  if(pts==null && jp.companies && j.company_id!=null){
    const co=jp.companies[String(j.company_id)]; if(co&&co.jobpoints!=null) pts=co.jobpoints;
  }
  if(pts!=null) c.appendChild(snapRow("Job points", fmt(pts)));
  return c;
}
const PERK_SRC=[["faction_perks","Faction","faction"],["job_perks","Job","job"],
  ["property_perks","Property","property"],["merit_perks","Merit","merit"],
  ["education_perks","Education","education"],["book_perks","Book","book"],
  ["enhancer_perks","Enhancer","enhancer"],["stock_perks","Stock","growth"]];
function perksCard(){
  const pk=DATA.perks||{};
  const groups=PERK_SRC.map(([k,label,ic])=>[label,ic,(pk[k]||[])]).filter(g=>g[2].length);
  if(!groups.length) return null;
  const total=groups.reduce((a,g)=>a+g[2].length,0);
  const card=el("div","card");
  const h=cardH("Active Perks","merit"); h.appendChild(el("span","pill accent",total+"")); card.appendChild(h);
  const strip=el("div","pstrip");
  const lab=el("div","plab"), list=el("div");
  if(PERK_SEL==null || !groups.find(g=>g[0]===PERK_SEL)) PERK_SEL=groups[0][0];
  const draw=()=>{
    strip.innerHTML=""; 
    groups.forEach(([label,ic,arr])=>{
      const b=el("button","pico"+(label===PERK_SEL?" on":"")); b.title=label+" ("+arr.length+")";
      b.innerHTML=icon(ic,16); b.onclick=()=>{PERK_SEL=label;draw();};
      strip.appendChild(b);
    });
    const g=groups.find(x=>x[0]===PERK_SEL);
    lab.textContent=g[0]+" · "+g[2].length+" perk"+(g[2].length===1?"":"s");
    list.innerHTML=g[2].map(pr=>"<div class='pl'>"+escapeHtml(String(pr))+"</div>").join("");
  };
  draw();
  card.appendChild(strip); card.appendChild(lab); card.appendChild(list);
  return card;
}
// Balanced masonry: place each card in the currently-shortest column so the
// columns end level and there are no ragged empty gaps at the bottom.
function masonry(p, cards){
  const w = window.innerWidth || 1200;
  const cols = w<=760 ? 1 : (w<=1080 ? 2 : 3);
  const wrap=el("div","mrow");
  const columns=[];
  for(let i=0;i<cols;i++){ const c=el("div","mcol"); wrap.appendChild(c); columns.push(c); }
  p.appendChild(wrap);                       // in the DOM so offsetHeight is real
  cards.forEach(card=>{
    let min=0;
    for(let i=1;i<columns.length;i++) if(columns[i].offsetHeight<columns[min].offsetHeight) min=i;
    columns[min].appendChild(card);
  });
  // re-flow once on resize (debounced) so the column count stays responsive
  if(!window.__ovResize){
    window.__ovResize=true; let t;
    window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(()=>{
      const ov=$("#tab-overview"); if(ov && !ov.classList.contains("hidden")) renderOverview();
    },200);});
  }
}
function renderOverview(){
  const p=$("#tab-overview"); p.innerHTML="";

let GR_METRIC="bstotal", GR_FROM=null, GR_TO=null;
const GR_METRICS=[["bstotal","Battle total"],["statscore","Stat score"],
  ["wstotal","Work total"],["strength","Strength"],["defense","Defense"],

function renderGrowth(){

      "the growth chart fills in. Torn's API has no back-history, so it starts now."));
    return;
  }
  const dates=hist.map(h=>h.date);
  if(!GR_FROM) GR_FROM=dates[0];
  if(!GR_TO) GR_TO=dates[dates.length-1];

  // controls
  const metSeg=el("div","seg");
  GR_METRICS.forEach(([v,l])=>{const b=el("button",GR_METRIC===v?"on":null,l);
    b.onclick=()=>{GR_METRIC=v;renderGrowth();}; metSeg.appendChild(b);});

  const rows=hist.filter(h=>h.date>=GR_FROM && h.date<=GR_TO && h[GR_METRIC]!=null);
  if(rows.length<1){ p.appendChild(el("div","infobox","No snapshots in that range yet."));
    return; }

  // delta summary
  const a=rows[0], b=rows[rows.length-1];
  const delta=(b[GR_METRIC]||0)-(a[GR_METRIC]||0);
  const days=Math.max(1,((b.ts||0)-(a.ts||0))/86400);
  const perDay=delta/days;
  const label=(GR_METRICS.find(m=>m[0]===GR_METRIC)||[])[1]||GR_METRIC;
  const mk=(t,v,n,acc)=>{const c=el("div","card");c.appendChild(cardH(t,"growth"));
    c.appendChild(el("div","big"+(acc?" accent":""),v));if(n)c.appendChild(el("div","cardnote",n));return c;};
  const g=el("div","grid g3"); g.style.marginTop="12px";
  const dispDelta = GR_METRIC==="statscore" ? (Math.round(delta*100)/100).toLocaleString() : fmt(Math.round(delta));
  g.appendChild(mk(label+" gain", (delta>=0?"+":"")+dispDelta, GR_FROM+" → "+GR_TO, true));
  g.appendChild(mk("Per day", (perDay>=0?"+":"")+fmt(Math.round(perDay)), "average over range"));
  g.appendChild(mk("Snapshots", String(rows.length), Math.round(days)+" days spanned"));
  p.appendChild(g);

  // chart
  const card=el("div","card"); card.style.marginTop="16px";
  card.appendChild(cardH(label+" over time","growth"));
  card.appendChild(buildChart(rows, GR_METRIC));
  p.appendChild(card);

  p.appendChild(el("div","infobox","One snapshot is saved per day the dashboard "+
    "fetches. Keep using it and the range grows. Delete history.json to reset."));
}
function buildChart(rows, metric){
  const W=760, H=260, padL=64, padR=16, padT=16, padB=28;
  const xs=rows.map(r=>r.ts), ys=rows.map(r=>r[metric]);
  const xMin=Math.min(...xs), xMax=Math.max(...xs);
  let yMin=Math.min(...ys), yMax=Math.max(...ys);
  if(yMin===yMax){yMin-=1;yMax+=1;}
  const px=t=>padL+(xMax===xMin?0.5:(t-xMin)/(xMax-xMin))*(W-padL-padR);
  const py=v=>padT+(1-(v-yMin)/(yMax-yMin))*(H-padT-padB);
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("class","chart");
  const defs=document.createElementNS(NS,"defs");
  defs.innerHTML='<linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#8ea3d8"/><stop offset="1" stop-color="#b3a8e0"/></linearGradient>';
  svg.appendChild(defs);
  // gridlines + y labels (4)
  for(let i=0;i<=4;i++){
    const v=yMin+(yMax-yMin)*i/4; const y=py(v);
    const ln=document.createElementNS(NS,"line");
    ln.setAttribute("x1",padL);ln.setAttribute("x2",W-padR);ln.setAttribute("y1",y);ln.setAttribute("y2",y);
    ln.setAttribute("class","gl"); svg.appendChild(ln);
    const tx=document.createElementNS(NS,"text");
    tx.setAttribute("x",padL-8);tx.setAttribute("y",y+3);tx.setAttribute("text-anchor","end");
    tx.textContent=(metric==="statscore"?(Math.round(v*10)/10):Math.round(v)).toLocaleString();
    svg.appendChild(tx);
  }
  // line
  const pts=rows.map(r=>px(r.ts)+","+py(r[metric])).join(" ");
  const pl=document.createElementNS(NS,"polyline"); pl.setAttribute("points",pts); pl.setAttribute("class","ln");
  svg.appendChild(pl);
  // dots
  rows.forEach(r=>{const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",px(r.ts));c.setAttribute("cy",py(r[metric]));c.setAttribute("r",3);c.setAttribute("class","dt");
    svg.appendChild(c);});
  // x labels: first + last
  [rows[0],rows[rows.length-1]].forEach((r,i)=>{const tx=document.createElementNS(NS,"text");
    tx.setAttribute("x", i===0?padL:W-padR);tx.setAttribute("y",H-8);
    tx.setAttribute("text-anchor", i===0?"start":"end"); tx.textContent=r.date; svg.appendChild(tx);});
  return svg;
}

let EDU_MAJOR=null, EDU_COURSE=null, EDU_QUERY="", EDU_QUICK="tree";
const EDU_MAJORS = {
  BIO:"Biology", BUS:"Business", CMB:"Combat Training", CBT:"Combat Training",
  WEP:"Combat Training", GUN:"Combat Training", CMP:"Computer Science",
  COM:"Computer Science", CSC:"Computer Science", CMT:"Computer Science", GEN:"General Studies",

  MTH:"Mathematics", MAT:"Mathematics", PSY:"Psychology", DEF:"Self Defense",

};
function eduMajor(o){
  if(o.category) return String(o.category);
  const code=String(o.code||o.name||"").toUpperCase();
  const m=code.match(/^([A-Z]+)/);
  if(m && EDU_MAJORS[m[1]]) return EDU_MAJORS[m[1]];
  if(m && EDU_MAJORS[m[1].slice(0,3)]) return EDU_MAJORS[m[1].slice(0,3)];
  return o.field||o.type||"Other";
}
// results: { perk:[...], intelligence:["65 "], endurance:["10 "], manual_labor:["N "] }
function eduResults(o){
  const outcomes=[]; const stats={manual_labor:0,intelligence:0,endurance:0};
  const r=o.results||o.result||{};
  const grab=(k)=>{ const v=r[k]; if(v==null) return 0;
    if(Array.isArray(v)) return v.reduce((a,x)=>a+(parseFloat(String(x))||0),0);
    return parseFloat(String(v))||0; };
  stats.intelligence=grab("intelligence"); stats.endurance=grab("endurance");
  stats.manual_labor=grab("manual_labor")||grab("manuallabor");
  const perk=r.perk||r.perks;
  if(Array.isArray(perk)) perk.forEach(x=>{ if(x) outcomes.push(String(x).trim()); });
  else if(typeof perk==="string") outcomes.push(perk.trim());
  // also parse "Gain N stat" sentences that landed in perk
  return {outcomes, stats};
}
function eduItems(){
  const e=DATA.education||{}; let def=e.def||{};
  const done=new Set((e.completed||[]).map(String));
  const cur=e.current!=null?String(e.current):null;
  const byId={}; const items=[];
  Object.keys(def).forEach(id=>{
    const o=def[id]||{}; const res=eduResults(o);
    const it={id:String(id), name:o.name||o.title||("Course "+id), code:String(o.code||""),
      major:eduMajor(o), outcomes:res.outcomes, stats:res.stats,
      cost:o.money_cost!=null?o.money_cost:(o.cost!=null?o.cost:null),
      duration:o.duration!=null?o.duration:(o.length!=null?o.length:null),
      prereq:(o.prerequisites||o.prerequisite||[]).map(String),
      done:done.has(String(id)), current:cur===String(id)};
    items.push(it); byId[String(id)]=it;
  });
  // resolve prereqs to names + compute availability (all prereqs done)
  items.forEach(it=>{
    it.prereqNames=it.prereq.map(pid=>(byId[pid]&&byId[pid].name)||("#"+pid));
    it.locked=it.prereq.some(pid=>byId[pid] && !byId[pid].done);
  });
  return {items, byId};
}
function eduState(it){                       // returns done|current|available|locked
  if(it.done) return "done";
  if(it.current) return "current";
  return it.locked ? "locked" : "available";
}
function fmtDur(sec){
  if(sec==null) return "";
  sec=+sec; const d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600), m=Math.floor((sec%3600)/60);
  return (d?d+"d ":"")+(h?h+"h ":"")+(m?m+"m":"")||"<1m";
}
function fmtDurLong(sec){                 // includes seconds — for the live countdown
  if(sec==null||sec<0) sec=0; sec=+sec;
  const d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600),
        m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  return (d?d+"d ":"")+(h||d?h+"h ":"")+(m||h||d?m+"m ":"")+s+"s";
}
// exact static duration — shows every non-zero part, no rounding (7d, or 4d 21h 36m)
function fmtExact(sec){
  sec=+sec||0;
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600),
        m=Math.floor(sec%3600/60), s=Math.floor(sec%60);
  const p=[]; if(d)p.push(d+"d"); if(h)p.push(h+"h"); if(m)p.push(m+"m"); if(s)p.push(s+"s");
  return p.length?p.join(" "):"0m";
}

// ---- clean prerequisite tree (orthogonal connectors, bundled capstone) ----
function eduTree(list, byId){
  if(!list.length){ const d=el("div","cardnote","No courses."); return d; }
  const W=184,H=56,COLGAP=240,ROWGAP=70,PADX=16,PADY=14;
  // tier = 1 + max prereq tier (within this major). Capstone lands on its own far column.
  const inMajor=new Set(list.map(i=>i.id));
  const memo={};
  const tierOf=(i,seen)=>{
    if(memo[i.id]!=null) return memo[i.id];
    seen=seen||new Set(); if(seen.has(i.id)) return 0; seen.add(i.id);
    const pre=i.prereq.filter(p=>inMajor.has(p));
    let t=0; pre.forEach(p=>{ const pi=byId[p]; if(pi) t=Math.max(t,tierOf(pi,seen)+1); });
    return memo[i.id]=t;
  };
  list.forEach(i=>tierOf(i));
  const maxTier=Math.max(0,...list.map(i=>memo[i.id]));
  // group by tier, assign positions
  const cols={}; list.forEach(i=>{(cols[memo[i.id]]=cols[memo[i.id]]||[]).push(i);});
  const pos={}; let maxRows=0;
  Object.keys(cols).forEach(t=>{ maxRows=Math.max(maxRows,cols[t].length); });
  Object.keys(cols).forEach(t=>{
    cols[t].sort((a,b)=>a.code.localeCompare(b.code));
    cols[t].forEach((i,idx)=>{ pos[i.id]=[PADX+(+t)*COLGAP, PADY+idx*ROWGAP]; });
  });
  const width=PADX*2+(maxTier+1)*COLGAP - (COLGAP-W);
  const height=PADY*2+maxRows*ROWGAP;
  const cx=(id)=>pos[id][0], cyid=(id)=>pos[id][1]+H/2;
  let edges="", nodes="";
  list.forEach(i=>{
    const pre=i.prereq.filter(p=>inMajor.has(p) && pos[p]);
    // "capstone" = depends on many; draw its edges faint
    const cap=pre.length>=Math.max(3, Math.ceil(list.length*0.5));
    pre.forEach(p=>{
      const sx=cx(p)+W, sy=cyid(p), tx=cx(i.id), ty=cyid(i.id), mx=(sx+tx)/2;
      edges+="<path d='M"+sx+","+sy+" H"+mx+" V"+ty+" H"+tx+"' fill='none' stroke='"+
        (cap?"#3a3a4e":"#5b5b78")+"' stroke-width='"+(cap?1:1.5)+"' opacity='"+(cap?.5:.8)+"'/>";
    });
  });
  list.forEach(i=>{
    const [x,y]=pos[i.id]; const [bg,bd]=eduStateColors(eduState(i));
    const tcol=eduState(i)==="locked"?"#8b8ba0":"#e6e3f0";
    nodes+="<g><rect x='"+x+"' y='"+y+"' width='"+W+"' height='"+H+"' rx='8' fill='"+bg+"' stroke='"+bd+"' stroke-width='1.5'/>"+
      "<foreignObject x='"+x+"' y='"+y+"' width='"+W+"' height='"+H+"'>"+
      "<div xmlns='http://www.w3.org/1999/xhtml' style='height:100%;box-sizing:border-box;padding:6px 10px;display:flex;flex-direction:column;justify-content:center'>"+
      "<div style='font-family:monospace;font-size:9px;color:"+bd+";margin-bottom:2px'>"+escapeHtml(i.code||"")+"</div>"+
      "<div style='font-size:11.5px;font-weight:600;color:"+tcol+";line-height:1.2;overflow-wrap:break-word;word-break:break-word'>"+escapeHtml(i.name||"")+"</div>"+
      "</div></foreignObject></g>";
  });
  const holder=el("div");
  holder.innerHTML="<svg width='"+width+"' height='"+height+"' viewBox='0 0 "+width+" "+height+
    "' xmlns='http://www.w3.org/2000/svg'>"+edges+nodes+"</svg>";
  return holder;
}
// ---- timeline / Gantt strip: courses end-to-end by EXACT duration ----
function eduTimeline(list){
  if(!list.length){ return el("div","cardnote","No courses."); }
  const order={done:0,current:1,available:2,locked:3};
  const items=list.slice().filter(i=>i.duration!=null).sort((a,b)=>
    (order[eduState(a)]-order[eduState(b)]) || (a.code||"").localeCompare(b.code||""));
  const total=items.reduce((a,i)=>a+(+i.duration||0),0) || 1;
  const doneSec=items.filter(i=>eduState(i)==="done").reduce((a,i)=>a+(+i.duration||0),0);
  const nowSec=items.filter(i=>eduState(i)==="current").reduce((a,i)=>a+(+i.duration||0),0);
  const holder=el("div"); holder.style.minWidth="520px";
  // summary
  const sum=el("div"); sum.style.cssText="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px";
  sum.innerHTML="<span style='color:var(--muted)'>Total <b style='color:var(--text)'>"+fmtExact(total)+"</b></span>"+
    "<span><b style='color:var(--good)'>"+fmtExact(doneSec)+" done</b> · <b style='color:var(--warn)'>"+fmtExact(nowSec)+" now</b> · "+fmtExact(total-doneSec-nowSec)+" ahead</span>";
  holder.appendChild(sum);
  // strip
  const wrap=el("div"); wrap.style.position="relative";
  const strip=el("div"); strip.style.cssText="display:flex;height:32px;border-radius:8px;overflow:hidden;border:1px solid var(--border)";
  items.forEach(i=>{
    const w=(+i.duration||0)/total*100; const [,bd]=eduStateColors(eduState(i));
    const seg=el("div"); seg.title=(i.name||"")+" — "+fmtExact(i.duration);
    seg.style.cssText="flex:0 0 "+w+"%;background:"+bd+";opacity:"+(eduState(i)==="locked"?".55":".9")+
      ";display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(15,16,23,.5)";
    if(w>10) seg.innerHTML="<span style='font-size:10.5px;font-weight:700;color:#12131a'>"+fmtExact(i.duration)+"</span>";
    strip.appendChild(seg);
  });
  wrap.appendChild(strip);
  // you-are-here marker at the done/now boundary
  const mk=el("div"); const mp=(doneSec/total*100);
  mk.style.cssText="position:absolute;top:-3px;height:38px;left:"+mp+"%;width:2px;background:var(--warn)";
  const mlab=el("div"); mlab.style.cssText="position:absolute;top:-18px;left:"+mp+"%;transform:translateX(-50%);font-size:10px;color:var(--warn);font-weight:700;white-space:nowrap";
  mlab.textContent="▼ you are here";
  wrap.appendChild(mk); wrap.appendChild(mlab);
  holder.appendChild(wrap);
  // names under wide segments
  const names=el("div"); names.style.cssText="display:flex;margin-top:4px";
  items.forEach(i=>{ const w=(+i.duration||0)/total*100; const d=el("div");
    d.style.cssText="flex:0 0 "+w+"%;font-size:10px;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px";
    d.textContent=w>10?(i.name||""):""; names.appendChild(d); });
  holder.appendChild(names);
  return holder;
}

function crimeUniques(id, c){
  // returns {gathered, total, missing} from master (torn/crimes) vs your ids
  const d=(DATA.crime_defs||{})[String(id)];
  if(!d || !d.unique_total) return null;
  const master=new Set((d.unique_ids||[]).map(Number));
  const mine=(c._gathered_unique_ids||[]).map(Number).filter(x=>master.has(x));
  const gathered=mine.length, total=d.unique_total;
  return {gathered, total, missing:Math.max(0,total-gathered)};
}

        : uq.gathered+" / "+uq.total+" <small>· "+uq.missing+" missing</small>"),
      uq.total?uq.gathered/uq.total*100:0, uq.missing===0?"maxed":null));

    // detailed pass/fail breakdown

      "<div>Fail <b style='color:var(--bad)'>"+fmt(a.fail)+"</b></div>"+
      "<div>Critical fail <b style='color:var(--bad)'>"+fmt(a.critical_fail)+"</b></div>"+
      (succ!=null?"<div>Success rate <b>"+succ+"%</b></div>":"")+

      (c.progression_bonus!=null?"<div>Progression <b>"+c.progression_bonus+"</b></div>":"")+
      (c.rewards&&c.rewards.money!=null?"<div>Money <b>$"+fmt(c.rewards.money)+"</b></div>":"");
    card.appendChild(mini);

    // per-subcrime pass/fail — only NAMED where we've verified the mapping.
    const subs=(a.subcrimes||[]).slice().sort((x,y)=>(x.id||0)-(y.id||0));
    const names=SUBCRIME_NAMES[id];
    if(subs.length && names){
      const tbl=el("table");
      tbl.innerHTML="<thead><tr><th>Subcrime</th><th class='num'>Attempts</th>"+
        "<th class='num'>Pass</th><th class='num'>Fail</th><th class='num'>Rate</th></tr></thead>";
      const tb=el("tbody");
      subs.forEach((s,i)=>{
        const nm=names[i] || ("Subcrime "+s.id+" (unnamed)");
        const unnamed=!names[i];
        const r=s.total?pct1((s.success||0)/s.total*100)+"%":"—";
        const tr=el("tr");
        tr.innerHTML="<td"+(unnamed?" style='color:var(--faint)'":"")+">"+nm+"</td>"+
          "<td class='num'>"+fmt(s.total)+"</td>"+

          "<td class='num'>"+r+"</td>";
        tb.appendChild(tr);
      });
      tbl.appendChild(tb); card.appendChild(tbl);
    } else if(subs.length){
      card.appendChild(el("div","cardnote",
        "Crime-level stats only — subcrimes for this crime aren't name-mapped yet."));
    }
    if(uq && uq.missing>0){
      card.appendChild(el("div","cardnote",
        "Missing "+uq.missing+" unique"+(uq.missing>1?"s":"")+" — names & conditions on "+
        "<a href='https://torn.report/uniques' target='_blank'>torn.report</a>."));
    }
    p.appendChild(card);
  });

  p.appendChild(el("div","infobox",
    "Everything here is live from the API: names, categories, enhancers and unique "+
    "totals from torn/crimes; skill, pass/fail/critical-fail and money per crime and "+
    "subcrime. Unique counts match your gathered outcome IDs against the master list. "+
    "Subcrime names are wiki-sourced and verified only where shown."));
}

function meritFx(name){
  const k=String(name).toLowerCase();
  if(MERIT_FX[k]) return MERIT_FX[k];

  if(k.endsWith("mastery")) return {mast:true,icon:"battle"};
  return {per:null,u:"",label:"",icon:"merit"};
}

function awardItems(){

}

// SVG progress ring; size>40 prints the % in the middle
function awardRing(pct, size, done){
  pct=Math.max(0,Math.min(100,pct||0));
  const s=size, r=s/2-Math.max(3,size*0.09), c=2*Math.PI*r, off=c*(1-pct/100);
  const col=done?"#e2c78c":"#8ea3d8", sw=size>40?5:3.5;
  const txt=size>40?"<text x='"+(s/2)+"' y='"+(s/2+4)+"' text-anchor='middle' font-size='12' font-weight='700' fill='var(--text)'>"+Math.round(pct)+"%</text>":"";
  return "<svg width='"+s+"' height='"+s+"' viewBox='0 0 "+s+" "+s+"' style='flex:0 0 auto'>"+
    "<circle cx='"+(s/2)+"' cy='"+(s/2)+"' r='"+r+"' fill='none' stroke='rgba(160,160,190,.14)' stroke-width='"+sw+"'/>"+
    "<circle cx='"+(s/2)+"' cy='"+(s/2)+"' r='"+r+"' fill='none' stroke='"+col+"' stroke-width='"+sw+"' stroke-linecap='round' stroke-dasharray='"+c+"' stroke-dashoffset='"+off+"' transform='rotate(-90 "+(s/2)+" "+(s/2)+")'/>"+
    txt+"</svg>";
}

    "<div class='bar"+(max?" maxed":"")+"' style='margin:7px 0 8px'><i style='width:"+(lvl*10)+"%'></i></div>";

// ---- Merit reset simulator ----
const triCost=l=>l*(l+1)/2;
function renderMeritSim(p){
  const m=DATA.merits||{}; const keys=Object.keys(m).sort((a,b)=>(+m[b]||0)-(+m[a]||0));
  if(SIM_LEVELS==null){ SIM_LEVELS={}; keys.forEach(k=>SIM_LEVELS[k]=+m[k]||0); }
  const budget=keys.reduce((a,k)=>a+triCost(+m[k]||0),0);
  const spent=keys.reduce((a,k)=>a+triCost(SIM_LEVELS[k]||0),0);
  const rem=budget-spent, over=spent>budget;

  const bar=el("div","card");
  const bh=cardH("Reset Simulator","effective");
  const back=el("button","goalsave","← Back to merits"); back.style.marginLeft="auto";
  back.onclick=()=>{SIM_ON=false;renderAwards();}; bh.appendChild(back); bh.style.display="flex"; bh.style.alignItems="center";
  bar.appendChild(bh);
  bar.appendChild(el("div","cardnote","Reallocate the points you'd get back from resetting your current merits. Not real — a what-if."));
  bar.appendChild(meterRow("Points used",
    spent+" / "+budget+" <small style='color:"+(over?"var(--bad)":"var(--good)")+"'>"+rem+" left</small>",
    Math.min(100,spent/budget*100), over?null:null));
  const btns=el("div"); btns.style.marginTop="8px";
  const bReset=el("button","goalsave","Reset to current"); bReset.onclick=()=>{keys.forEach(k=>SIM_LEVELS[k]=+m[k]||0);renderAwards();};
  const bZero=el("button","goalsave","Clear all"); bZero.style.marginLeft="8px"; bZero.onclick=()=>{keys.forEach(k=>SIM_LEVELS[k]=0);renderAwards();};
  btns.appendChild(bReset); btns.appendChild(bZero); bar.appendChild(btns);
  p.appendChild(bar);

  const list=el("div","card"); list.style.marginTop="16px";
  keys.forEach(k=>{
    const fx=meritFx(k); const cur=+m[k]||0, s=SIM_LEVELS[k]||0;
    const sign=v=>(v>0?"+":"")+(Math.round(v*10)/10)+(fx.u||"");
    const row=el("div","simrow");
    let eff="";
    if(fx.mast){
      const md=v=>"+"+v+"% dmg · +"+(Math.round(v*0.2*10)/10)+" acc";
      eff = s===cur ? "<span style='color:var(--muted)'>"+md(s)+"</span>"
        : "<span style='color:var(--muted)'>"+md(cur)+"</span> → <b style='color:"+(s>cur?"var(--good)":"var(--warn)")+"'>"+md(s)+"</b>";
    } else if(fx.per!=null){
      eff = s===cur ? "<span style='color:var(--muted)'>"+sign(s*fx.per)+" "+fx.label+"</span>"
        : "<span style='color:var(--muted)'>"+sign(cur*fx.per)+"</span> → <b style='color:"+(s>cur?"var(--good)":"var(--warn)")+"'>"+sign(s*fx.per)+" "+fx.label+"</b>";
    }
    row.innerHTML="<span class='sr-name'>"+icon(fx.icon,14)+escapeHtml(pretty(k))+"</span>";
    const ctl=el("div","sr-ctl");
    const minus=el("button",null,"−"); minus.onclick=()=>{SIM_LEVELS[k]=Math.max(0,s-1);renderAwards();};
    const val=el("span","sr-val",s+"/10");
    const plus=el("button",null,"+"); plus.onclick=()=>{SIM_LEVELS[k]=Math.min(10,s+1);renderAwards();};
    ctl.appendChild(minus); ctl.appendChild(val); ctl.appendChild(plus);
    row.appendChild(ctl);
    const e=el("div","sr-eff"); e.innerHTML=eff; row.appendChild(e);
    list.appendChild(row);
  });
  p.appendChild(list);
  p.appendChild(el("div","infobox",
    "Budget assumes the standard cost curve (maxing a merit = 55 points). If a merit "+
    "uses a flat cost in-game the number may differ slightly — tell me and I'll adjust."));
}

  const left=el("div","card awcats");
  cats.sort().forEach(cat=>{
    const list=all.filter(i=>i.cat===cat); const gd=list.filter(i=>i.done).length, gt=list.length;
    const on=cat===AW_CAT, done=gd>=gt;
    const row=el("div","awcat"+(on?" on":""));
    row.innerHTML=awardRing(gt?gd/gt*100:0,26,done)+
      "<span class='awcat-n'>"+escapeHtml(pretty(cat))+"</span>"+
      "<span class='awcat-c'"+(done?" style='color:var(--warn)'":"")+">"+gd+" / "+gt+"</span>";
    row.onclick=()=>{AW_CAT=cat;renderAwards();};
    left.appendChild(row);
  });
  const right=el("div","card awpane"); right.id="aw-pane";
  two.appendChild(left); two.appendChild(right);
  p.appendChild(two);

  if(AW_CAT==null || !cats.includes(AW_CAT)) AW_CAT=cats.sort()[0];
  updateAwardPane(type);
}
function updateAwardPane(type){
  const pane=$("#aw-pane"); if(!pane) return;
  const all=awardItems().filter(i=>i.type===type && i.cat===AW_CAT);
  let items=all.filter(i=>{
    if(AW_AWFILTER==="done"&&!i.done) return false;
    if(AW_AWFILTER==="not"&&i.done) return false;
    if(AW_AWQUERY){const q=AW_AWQUERY.toLowerCase();
      if(!(i.name.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q))) return false;}
    return true;
  });
  const gd=all.filter(i=>i.done).length, gt=all.length, done=gd>=gt;
  const cnt=$("#aw-count"); if(cnt) cnt.textContent=items.length+" shown";
  pane.innerHTML="";
  // header: progress ring + % beside the category name and count, rarity breakdown on the right
  const RORDER=["Very Common","Common","Uncommon","Rare","Very Rare","Limited","Extremely Rare"];
  const rc={}; all.forEach(i=>{const r=i.rarity||"Other";(rc[r]=rc[r]||{d:0,t:0}).t++; if(i.done)rc[r].d++;});
  const rbits=RORDER.filter(r=>rc[r]).map(r=>
    "<span class='rbadge"+(rc[r].d>=rc[r].t?" full":"")+"'>"+escapeHtml(r)+" <b>"+rc[r].d+"/"+rc[r].t+"</b></span>").join("");
  const head=el("div","awpane-head");
  head.innerHTML=awardRing(gt?gd/gt*100:0,54,done)+
    "<div class='aph-txt'><div class='aph-name'>"+escapeHtml(pretty(AW_CAT))+"</div>"+
    "<div class='aph-sub'>"+gd+" / "+gt+" earned · "+pct1(gt?gd/gt*100:0)+"%"+
    (done?" <span style='color:var(--warn)'>· complete</span>":"")+"</div></div>"+
    (rbits?"<div class='aph-rar'>"+rbits+"</div>":"");
  pane.appendChild(head);
  const listWrap=el("div","awlist");
  items.sort((a,b)=>(a.done-b.done)||a.name.localeCompare(b.name)).forEach(i=>{
    const row=el("div","awrow"+(i.done?" edu-done":""));
    row.appendChild(el("div","awmark "+(i.done?"done":"lock"), i.done?"\u2713":"\u25CB"));
    const body=el("div","awbody");
    body.innerHTML="<div class='awname'>"+escapeHtml(i.name)+
      (i.rarity?"<span class='awtag'>"+escapeHtml(i.rarity)+"</span>":"")+
      (i.circ!=null?"<span class='awtag'>"+fmt(i.circ)+" have this</span>":"")+"</div>"+
      (i.desc?"<div class='awdesc'>"+escapeHtml(i.desc)+"</div>":"");
    row.appendChild(body); listWrap.appendChild(row);
  });
  if(!items.length) listWrap.appendChild(el("div","cardnote","Nothing matches that filter/search."));
  pane.appendChild(listWrap);
}

// ---- shell ----------------------------------------------------------------
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function renderErrors(){
  const box=$("#errors"); box.innerHTML="";
  if(DATA&&DATA._error){box.appendChild(el("div","banner",DATA._error));return;}
  const errs=(DATA&&DATA.errors)||{};
  Object.entries(errs).forEach(([k,v])=>box.appendChild(el("div","banner","<b>"+pretty(k)+":</b> "+escapeHtml(v))));
}
function renderProfile(){
  const p=(DATA&&DATA.profile)||{}; $("#pname").textContent=p.name||"—";
  const meta=[]; if(p.level!=null)meta.push("Lv "+p.level);
  if(p.player_id!=null)meta.push("ID "+p.player_id); if(p.rank)meta.push(p.rank);
  $("#pmeta").textContent=meta.join(" · ")||"";
}
// decorate tab buttons with their icons + set the fixed subtitle
(function(){
  document.querySelectorAll("#tabs .tab").forEach(b=>{
    const ic=b.getAttribute("data-icon");
    if(ic && ICONS[ic]) b.innerHTML=icon(ic,15)+b.textContent;
  });
  const s=$("#brandsub"); if(s) s.textContent="Personal Intel Report";
})();

async function load(force){
  const btn=$("#refreshBtn"); btn.disabled=true; btn.textContent="Loading…";
  try{ DATA=await TornHub.fetchView("stats"); if(DATA&&DATA.error) DATA={_error:DATA.error}; }
  catch(e){ DATA={_error:"Could not reach Torn: "+e.message+". Press Refresh to try again."}; }
  renderErrors(); renderProfile();
  renderOverview(); renderGrowth(); renderCrimes();
  renderAwards(); renderEducation();
  const t=DATA&&DATA.fetched_at?new Date(DATA.fetched_at*1000).toLocaleString():"—";
  $("#foot").innerHTML="Data fetched "+t+(DATA&&DATA.cached?" (cached)":"")+
    " · read live from Torn through your private data service.";
  btn.disabled=false; btn.textContent="Refresh";
}
load(false);
</script>
