<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="config.js"></script>
<script src="nav.js"></script>
<style>
  :root{
    --bg:#0e0f14; --bg2:#0b0c11; --surface:#171a24; --surface2:#1d2130;
    --border:rgba(184,180,214,.12); --border2:rgba(184,180,214,.22);
    --text:#e9e7f2; --muted:#9a96b0; --faint:#6b6880;
    --accent:#b3a8e0; --accent2:#8ea3d8;
    --good:#87c9a6; --warn:#e2c78c; --bad:#d99a9a;
    --glow:0 0 24px rgba(179,168,224,.18); --radius:16px;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 600px at 78% -12%, rgba(142,163,216,.10), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(179,168,224,.09), transparent 60%),
      var(--bg);
    color:var(--text);
    font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    letter-spacing:.1px; min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .moon{width:38px;height:38px;flex:0 0 auto;filter:drop-shadow(0 0 10px rgba(160,150,220,.35))}
  h1{font-size:20px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .spacer{flex:1}
  .idcard{text-align:right;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:8px 14px;min-width:150px}
  .idcard .nm{font-weight:600}.idcard .mt{color:var(--muted);font-size:12px}
  button.refresh{background:linear-gradient(180deg,#232838,#1a1e2b);color:var(--text);
    border:1px solid var(--border2);border-radius:11px;padding:9px 15px;cursor:pointer;
    font-size:13.5px;transition:.15s}
  button.refresh:hover{border-color:var(--accent);box-shadow:var(--glow)}
  button.refresh:disabled{opacity:.5;cursor:default;box-shadow:none}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 22px;border-bottom:1px solid var(--border)}
  .tab{background:transparent;border:none;color:var(--muted);padding:10px 16px 12px;cursor:pointer;
    font-size:14px;position:relative;border-radius:10px 10px 0 0;transition:.15s}
  .tab:hover{color:var(--text)} .tab.active{color:var(--text)}
  .tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  /* masonry: cards keep natural height and pack with no stretched gaps */
  .mrow{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
  .mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .mcol>.card{margin:0}
  .pstrip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .pico{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
  .pico:hover{border-color:var(--accent)}
  .pico.on{background:rgba(142,163,216,.16);color:var(--accent);border-color:var(--accent)}
  .plab{font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:capitalize}
  .pl{font-size:12.5px;color:var(--text);padding:4px 0;border-bottom:1px solid var(--border)}
  .pl:last-child{border-bottom:none}
  @media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
  /* meter row: label+value on one line, bar full width below — never clips */
  .meter{padding:9px 0;border-bottom:1px solid var(--border)}
  .meter:last-child{border-bottom:none}
  .meter .mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .meter .mnm{color:var(--text);display:inline-flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meter .mvl{color:var(--text);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .meter .mvl small{color:var(--muted);font-weight:500;margin-left:5px}
  .meter.maxed .mvl{color:var(--warn)}
  /* inline meter: name | bar | number on one line */
  .meterin{display:flex;align-items:center;gap:11px;padding:6px 0;border-bottom:1px solid var(--border)}
  .meterin:last-child{border-bottom:none}
  .meterin .mi-nm{flex:0 0 132px;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:var(--text);font-size:13px}
  .meterin .bar{flex:1;margin:0}
  .meterin .mi-vl{flex:0 0 auto;min-width:90px;text-align:right;font-weight:600;
    font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px;display:inline-flex;
    align-items:center;justify-content:flex-end;gap:5px}
  .meterin .mi-vl small{color:var(--muted);font-weight:500}
  .maxtag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;
    color:#161616;background:linear-gradient(180deg,#f0d98a,#d9b775);border-radius:5px;
    padding:1px 5px;margin-left:7px;vertical-align:1px}
  .meritgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
  .meritcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px}
  .meritcard.maxed{border-color:rgba(217,183,117,.5)}
  .mc-top{display:flex;align-items:center;gap:6px}
  .mc-top svg{color:var(--muted);flex:0 0 auto}
  .mc-name{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-lvl{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .mc-fx{display:flex;justify-content:space-between;font-size:12px;margin-top:3px}
  .mc-fx span{color:var(--muted)}
  .simrow{display:grid;grid-template-columns:1.3fr auto 1.4fr;gap:10px;align-items:center;
    padding:9px 4px;border-bottom:1px solid var(--border)}
  .simrow:last-child{border-bottom:none}
  .sr-name{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text);min-width:0}
  .sr-name svg{color:var(--muted);flex:0 0 auto}
  .sr-ctl{display:flex;align-items:center;gap:6px}
  .sr-ctl button{width:26px;height:26px;padding:0;border:1px solid var(--border2);background:var(--surface);
    color:var(--text);border-radius:7px;cursor:pointer;font-size:15px;line-height:1}
  .sr-ctl button:hover{border-color:var(--accent)}
  .sr-val{min-width:36px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
  .sr-eff{font-size:12px;text-align:right}
  .card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);
    border-radius:var(--radius);padding:13px 15px 11px;position:relative;overflow:hidden}
  .card h3{margin:0 0 10px;padding-bottom:8px;font-size:14px;color:var(--accent);font-weight:700;
    text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    border-bottom:1px solid var(--border2)}
  .card h3 svg{color:var(--accent)}
  .big{font-size:28px;font-weight:700;letter-spacing:.3px}.big.accent{color:var(--accent)}
  .cardnote{color:var(--faint);font-size:12px;margin-top:3px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row .lbl{flex:0 0 168px;color:var(--text)}
  .row .val{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600}
  .bar{flex:1;height:9px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
  .bar>i{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px rgba(179,168,224,.4)}
  .bar.good>i{background:linear-gradient(90deg,#6fae8c,var(--good))}
  .bar.maxed>i{background:linear-gradient(90deg,#d9b775,var(--warn))}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
    border:1px solid var(--border2);color:var(--muted)}
  .pill.good{color:var(--good);border-color:rgba(135,201,166,.4)}
  .pill.warn{color:var(--warn);border-color:rgba(226,199,140,.4)}
  .pill.accent{color:var(--accent);border-color:rgba(179,168,224,.45)}
  .mini{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 12px}
  .mini div{font-size:12.5px;color:var(--muted)}
  .mini b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
  th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .banner{background:rgba(217,154,154,.09);border:1px solid rgba(217,154,154,.35);
    color:#f0c9c9;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
  .infobox{background:rgba(142,163,216,.08);border:1px solid rgba(142,163,216,.3);
    border-radius:12px;padding:12px 14px;font-size:13px;color:#cdd6ee;margin-top:16px}
  .hidden{display:none}
  .foot{color:var(--faint);font-size:12px;margin-top:26px;text-align:center}
  /* awards controls */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;transition:.12s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:linear-gradient(180deg,#262c3e,#1c2130);color:var(--text)}
  .search{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:9px 13px;font-size:13.5px;outline:none}
  .search:focus{border-color:var(--accent)}
  .count{color:var(--muted);font-size:12.5px;margin-left:auto}
  .awrow{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border)}
  .awrow:last-child{border-bottom:none}
  .awmark{flex:0 0 22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;margin-top:1px}
  .awmark.done{background:rgba(135,201,166,.16);color:var(--good);border:1px solid rgba(135,201,166,.4)}
  .awmark.lock{background:rgba(184,180,214,.06);color:var(--faint);border:1px solid var(--border)}
  .awbody{flex:1;min-width:0}
  .awname{font-weight:600;font-size:14px}
  .awdesc{color:var(--muted);font-size:12.5px;margin-top:1px}
  .awtag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--border2);
    color:var(--muted);margin-left:8px;vertical-align:middle;text-transform:uppercase;letter-spacing:.4px}
  .awprog{margin-top:6px;display:flex;align-items:center;gap:10px}
  .awprog .bar{max-width:280px}
  .awprog .pv{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .awlist{max-height:640px;overflow:auto;margin-top:6px}
  .edu-cat{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;
    padding-bottom:5px;border-bottom:1px solid var(--border2)}
  .edu-cat span:first-child{color:var(--accent);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  .edu-cc{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .perklist{max-height:280px;overflow:auto;margin-top:8px}
  .perkline{font-size:12.5px;color:var(--text);padding:3px 0;border-bottom:1px solid var(--border)}
  .perkline:last-child{border-bottom:none}
  .edu-code{display:inline-block;font-size:10.5px;color:var(--accent2);background:rgba(142,163,216,.1);
    border:1px solid var(--border);border-radius:5px;padding:0 5px;margin-right:6px;font-variant-numeric:tabular-nums}
  .awmark.prog{background:rgba(226,199,140,.14);color:var(--warn);border:1px solid rgba(226,199,140,.4)}
  .awmark.avail{background:rgba(142,163,216,.14);color:var(--accent);border:1px solid rgba(142,163,216,.4)}
  .tab svg{vertical-align:-3px;margin-right:5px}
  /* education states: green done, amber current, lavender available, grey locked */
  .awrow.edu-done{background:rgba(135,201,166,.06)}
  .awrow.edu-current{background:rgba(226,199,140,.06)}
  .awrow.edu-locked{opacity:.55}
  .awrow.sel{outline:1px solid var(--accent);border-radius:8px}
  .awrow{cursor:default}
  .edugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}
  .chiprow{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .statchip{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:1px 7px;border-radius:6px}
  .statchip.int{background:rgba(142,163,216,.16);color:#9fb1e0}
  .statchip.end{background:rgba(226,199,140,.16);color:#e2c78c}
  .statchip.man{background:rgba(135,201,166,.16);color:#7ec9a6}
  .card h3 .seg{margin-left:auto}
  .edutile{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px;cursor:pointer}
  .edutile:hover{border-color:var(--accent)}
  .edutile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .edutile.complete{border-color:rgba(217,183,117,.5)}
  .et-name{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:7px}
  .et-cc{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
  .dt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
  .dt-name{font-size:16px;font-weight:600;color:var(--text);margin-top:3px}
  .dt-sec{margin-bottom:12px}
  .dt-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .dt-val{font-size:13.5px;color:var(--text);line-height:1.5}
  /* two-pane awards (Option C) */
  .awtwo{display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,2fr);gap:12px;align-items:start}
  @media(max-width:720px){.awtwo{grid-template-columns:1fr}}
  /* awards overview band */
  .awband{display:flex;gap:28px;align-items:center;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);
    border-radius:14px;padding:15px 18px;margin-bottom:12px}
  .ab-num .ab-big{font-size:29px;font-weight:800;color:var(--accent);line-height:1}
  .ab-num .ab-mid{font-size:21px;font-weight:700;color:var(--text);line-height:1}
  .ab-sub{font-size:16px;color:var(--muted);font-weight:600}
  .ab-sub2{font-size:12px;color:var(--muted);font-weight:400}
  .ab-lbl{font-size:12px;color:var(--muted);margin-top:4px}
  .ab-div{border-left:1px solid var(--border);padding-left:28px}
  .ab-faint{color:var(--faint)}
  .ab-gold{color:var(--warn)}
  .awshare{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;font-size:13px}
  .awshare svg{color:currentColor}
  .awchase{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:6px}
  .chcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
  .ch-h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .ch-h svg{color:var(--accent)}
  .ch-body{font-size:12.5px;line-height:2;color:var(--text)}
  /* two-pane header ring */
  .awpane-head{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border2);
    padding-bottom:11px;margin-bottom:11px;flex-wrap:wrap}
  .aph-rar{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:320px}
  .rbadge{font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);
    border-radius:6px;padding:2px 8px;white-space:nowrap}
  .rbadge b{color:var(--text);font-variant-numeric:tabular-nums}
  .rbadge.full{border-color:var(--border-warning,rgba(226,199,140,.5))}
  .rbadge.full b{color:var(--warn)}
  .aph-name{font-size:15px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
  .aph-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .awcat{display:flex;align-items:center;gap:9px}
  .awcat .awcat-n{flex:1}
  /* share card overlay */
  .shareov{position:fixed;inset:0;background:rgba(8,9,14,.72);display:flex;align-items:center;
    justify-content:center;z-index:50;backdrop-filter:blur(3px)}
  .sharecard{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border2);
    border-radius:16px;padding:22px 26px;min-width:300px;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .sc-head{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
  .sc-big{font-size:38px;font-weight:800;color:var(--text);line-height:1}
  .sc-big span{font-size:20px;color:var(--muted);font-weight:600}
  .sc-sub{font-size:12.5px;color:var(--muted);margin:3px 0 14px}
  .sc-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)}
  .sc-row b{font-variant-numeric:tabular-nums}
  .sc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
  .sc-foot{font-size:11px;color:var(--faint);text-align:center;margin-top:14px}
  .awcats{padding:6px}
  .awcat{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 10px;border-radius:8px;cursor:pointer}
  .awcat:hover{background:var(--surface)}
  .awcat.on{background:rgba(142,163,216,.14)}
  .awcat-n{font-size:13px;color:var(--text)}
  .awcat.on .awcat-n{color:var(--accent)}
  .awcat-c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .awpane .awlist{max-height:600px;overflow:auto}
  /* overview snapshot */
  .snap{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--border)}
  .snap:last-child{border-bottom:none}
  .snap .k{color:var(--muted)}
  .snap .v{font-weight:600;font-variant-numeric:tabular-nums}
  .snap .v small{color:var(--accent2);font-weight:500;margin-left:6px}
  .snap .v em{color:var(--faint);font-style:normal;font-size:11.5px;margin-left:6px}
  .goaleditor{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .goaltitle{color:var(--muted);font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
  .goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .goalitem{display:flex;flex-direction:column;gap:3px}
  .goalitem span{color:var(--faint);font-size:11px}
  .goalitem input{background:var(--surface);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:6px 9px;font-size:12.5px;outline:none;font-variant-numeric:tabular-nums;width:100%}
  .goalitem input:focus{border-color:var(--accent)}
  /* growth */
  .daterow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
  .daterow label{color:var(--muted);font-size:12.5px}
  .daterow input[type=date]{background:var(--surface);border:1px solid var(--border);border-radius:9px;
    color:var(--text);padding:7px 10px;font-size:13px;outline:none}
  .daterow input[type=date]:focus{border-color:var(--accent)}
  .chart{width:100%;height:260px;display:block}
  .chart .gl{stroke:rgba(184,180,214,.10)}
  .chart .ln{fill:none;stroke:url(#gg);stroke-width:2.5}
  .chart .dt{fill:var(--accent)}
  .chart text{fill:var(--faint);font-size:11px}
  .guide{background:rgba(179,168,224,.06);border:1px solid rgba(179,168,224,.28);
    border-radius:12px;padding:14px 16px;margin-top:16px}
  .guide h4{margin:0 0 8px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
  .guide ul{margin:6px 0;padding-left:18px}
  .guide li{margin:4px 0;font-size:13px;color:var(--text)}
  .guide .warn{color:var(--warn)}
  .guide .good{color:var(--good)}
  a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}

  :root{--display:"Space Grotesk","Segoe UI",system-ui,sans-serif;--sans:"Inter","Segoe UI",system-ui,sans-serif}
  body{font-family:var(--sans)}
  .pagehead{display:flex;align-items:center;gap:14px;margin:6px 0 20px;flex-wrap:wrap}
  .tic{width:48px;height:48px;border-radius:14px;background:rgba(179,168,224,.1);border:1px solid var(--border);
    display:grid;place-items:center;font-size:26px;flex:0 0 auto}
  .pagehead h2{font:600 26px var(--display);margin:0}
  .pagehead p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .pagehead .spacer{flex:1}
  .stamp{color:var(--faint);font-size:12px}

  .pf-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:14px}
  .pf-hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:20px}
  .pf-av{width:110px;height:auto;max-height:160px;border-radius:22px;object-fit:contain;border:1px solid var(--border2);background:var(--surface2);flex:0 0 auto}
  .pf-av0{display:grid;place-items:center;font:600 38px var(--display);color:var(--accent)}
  .pf-main{flex:1;min-width:220px}
  .pf-main h2{font:600 30px var(--display);margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pf-main h2 a{color:var(--text)}
  .pf-main h2 small{font:500 15px var(--sans);color:var(--faint)}
  .pf-meta{color:var(--muted);font-size:13.5px;margin-top:3px}
  .pf-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .spill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--border2);color:var(--muted)}
  .spill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .spill.good{color:var(--good);border-color:rgba(135,201,166,.35);background:rgba(135,201,166,.08)}
  .spill.bad{color:var(--bad);border-color:rgba(217,154,154,.35);background:rgba(217,154,154,.08)}
  .spill.blue{color:var(--accent2);border-color:rgba(142,163,216,.35);background:rgba(142,163,216,.08)}
  .pf-life{flex:0 1 260px;min-width:200px}
  .pf-life .k{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .pf-life .k b{color:var(--text);font-variant-numeric:tabular-nums}
  .skel{height:150px;border-radius:16px;background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));opacity:.6}
</style>
</head>
<body data-section="profile">
<div class="wrap">
  <div class="pagehead"><div class="tic">👤</div><div><h2>Personal Profile</h2><p>Who you are in Torn, at a glance</p></div>
    <div class="spacer"></div><span class="stamp" id="stamp">loading…</span>
    <button class="refresh" id="refreshBtn" onclick="load()">Refresh</button></div>
  <div id="errors"></div>
  <div id="profilePane"><div class="skel"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const fmt=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

const ICONS={
  history:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',
  faction:'<path d="M5 21V5l7-2 7 2v16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 21v-5h6v5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="1.5" fill="currentColor"/>',
  property:'<path d="M4 11l8-6 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
};
function cardH(title, ic){ const h=el("h3"); h.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-2px;margin-right:7px;color:var(--accent)">'+(ICONS[ic]||"")+'</svg>'+title; return h; }
function snapRow(k,v){ const r=el("div","snap"); r.appendChild(el("div","k",k)); const x=el("div","v"); x.innerHTML=v; r.appendChild(x); return r; }
function tornLink(id,text){ return '<a href="https://www.torn.com/profiles.php?XID='+encodeURIComponent(id)+'" target="_blank" rel="noopener">'+escapeHtml(String(text))+'</a>'; }
function relTime(ts){ const d=Math.max(0,Math.floor(ts-Date.now()/1000)); if(!d)return ""; const h=Math.floor(d/3600),m=Math.floor((d%3600)/60); return h?(h+"h "+m+"m"):(m+"m"); }
let DATA=null;
function render(){
  const pane=$("#profilePane"); pane.innerHTML="";
  const p=(DATA&&DATA.profile)||{};
  if(!p.name){ pane.appendChild(el("div","card cardnote","Profile data is not available right now. Press Refresh to try again.")); return; }
  const hero=el("div","card pf-hero");
  let av; if(p.profile_image){ av=el("img","pf-av"); av.src=p.profile_image; av.alt=""; } else av=el("div","pf-av pf-av0",escapeHtml(String(p.name).charAt(0).toUpperCase()));
  hero.appendChild(av);
  const meta=[]; if(p.level!=null)meta.push("Level "+p.level); if(p.rank)meta.push(escapeHtml(p.rank)); if(p.role)meta.push(escapeHtml(p.role)); if(p.gender)meta.push(escapeHtml(p.gender));
  const st=p.status||{}; const scls={green:"good",red:"bad",blue:"blue"}[st.color]||"";
  let stHtml='<span class="spill '+scls+'">'+escapeHtml(st.description||st.state||"Unknown")+'</span>';
  if(st.until&&st.until*1000>Date.now()) stHtml+='<span class="cardnote">ends in '+relTime(st.until)+'</span>';
  if(st.details) stHtml+='<span class="cardnote">'+escapeHtml(String(st.details).replace(/<[^>]*>/g,""))+'</span>';
  const la=p.last_action||{};
  const main=el("div","pf-main");
  main.innerHTML='<h2>'+tornLink(p.player_id,p.name)+'<small>['+escapeHtml(String(p.player_id))+']</small></h2><div class="pf-meta">'+meta.join(" · ")+'</div>'+
    '<div class="pf-status">'+stHtml+(la.relative?'<span class="cardnote">Last action '+escapeHtml(la.relative)+'</span>':'')+'</div>';
  hero.appendChild(main);
  const life=p.life||((DATA.bars||{}).life)||{};
  if(life.maximum){ const lf=el("div","pf-life"); lf.innerHTML='<div class="k"><span>Life</span><b>'+fmt(life.current)+' / '+fmt(life.maximum)+'</b></div>';
    const bar=el("div","bar good"); const i=el("i"); i.style.width=clamp(life.current/life.maximum*100,0,100)+"%"; bar.appendChild(i); lf.appendChild(bar); hero.appendChild(lf); }
  pane.appendChild(hero);
  const grid=el("div","pf-grid");
  const card=(t,ic,rows)=>{ const c=el("div","card"); c.appendChild(cardH(t,ic)); rows.filter(r=>r&&r[1]!=null&&r[1]!=="").forEach(([k,v])=>c.appendChild(snapRow(k,v))); return c; };
  grid.appendChild(card("Account","history",[
    ["Player ID",escapeHtml(String(p.player_id))],
    ["Age",p.age!=null?fmt(p.age)+" days":null],
    ["Signed up",p.signup?escapeHtml(String(p.signup).split(" ")[0]):null],
    ["Donator",p.donator!=null?(+p.donator?'<span class="pill good">Yes</span>':"No"):null],
    ["Revivable",p.revivable!=null?(+p.revivable?"Yes":"No"):null],
    ["Last action",la.relative?escapeHtml(la.relative):null]]));
  const m=p.married||{}, f=p.faction||{}, j=p.job||{};
  grid.appendChild(card("Relationships","faction",[
    ["Spouse",+m.spouse_id?tornLink(m.spouse_id,m.spouse_name||m.spouse_id):"Single"],
    ["Days married",+m.spouse_id&&m.duration!=null?fmt(m.duration):null],
    ["Faction",+f.faction_id?escapeHtml(String(f.faction_name||""))+(f.faction_tag?' <em>['+escapeHtml(String(f.faction_tag))+']</em>':""):"None"],
    ["Faction position",+f.faction_id&&f.position?escapeHtml(String(f.position)):null],
    ["Days in faction",+f.faction_id&&f.days_in_faction!=null?fmt(f.days_in_faction):null],
    ["Job",j.company_name?escapeHtml(String(j.company_name)):(j.job?escapeHtml(String(j.job)):null)],
    ["Job position",j.position?escapeHtml(String(j.position)):null]]));
  const ownedCount=DATA.properties_owned!=null?(+DATA.properties_owned+1):null;   // +1 for the free Shack
  grid.appendChild(card("Home and Social","property",[
    ["Living in",p.property?escapeHtml(String(p.property)):null],
    ["Properties owned",ownedCount!=null?fmt(ownedCount):null],
    ["Karma",p.karma!=null?fmt(p.karma):null],
    ["Awards",p.awards!=null?fmt(p.awards):null],
    ["Friends",p.friends!=null?fmt(p.friends):null],
    ["Enemies",p.enemies!=null?fmt(p.enemies):null],
    ["Forum posts",p.forum_posts!=null?fmt(p.forum_posts):null]]));
  pane.appendChild(grid);
}
async function load(){
  const b=$("#refreshBtn"); b.disabled=true; b.textContent="Loading…"; $("#errors").innerHTML="";
  try{ DATA=await TornHub.fetchView("profile"); if(DATA.error) throw new Error(DATA.error);
    Object.entries(DATA.errors||{}).forEach(([k,v])=>$("#errors").appendChild(el("div","banner",escapeHtml(v))));
    render(); $("#stamp").textContent="Updated "+new Date().toLocaleTimeString();
  }catch(e){ $("#profilePane").innerHTML=""; $("#errors").appendChild(el("div","banner","Could not reach Torn: "+escapeHtml(e.message)+". Press Refresh to try again.")); $("#stamp").textContent="error"; }
  finally{ b.disabled=false; b.textContent="Refresh"; }
}
load();
</script>
</body>
</html>
